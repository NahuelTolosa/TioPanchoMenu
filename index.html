<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Tío Pancho - Menú Digital</title>
        <link rel="icon" type="image/png" href="img/logo.png">
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="styles/styles.css">

    <body>
        <div class="header">
            
            <div>

                    <img src="img/logo.png" alt="Logo Tío Pancho" class="logo">
                    <h1 id="header-title"></h1>

            </div>

            <div class="main-img-container"></div>

            <div class="wave-bottom">
                <div class="wave2">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320"><path fill="#FFB703" fill-opacity="1" d="M0,224L30,240C60,256,120,288,180,272C240,256,300,192,360,160C420,128,480,128,540,144C600,160,660,192,720,181.3C780,171,840,117,900,90.7C960,64,1020,64,1080,96C1140,128,1200,192,1260,197.3C1320,203,1380,149,1410,122.7L1440,96L1440,320L1410,320C1380,320,1320,320,1260,320C1200,320,1140,320,1080,320C1020,320,960,320,900,320C840,320,780,320,720,320C660,320,600,320,540,320C480,320,420,320,360,320C300,320,240,320,180,320C120,320,60,320,30,320L0,320Z"></path></svg>
                    <div class="wave2-fill"></div>
                </div>

                
                <div class="wave3">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320"><path fill="#1D3557" fill-opacity="1" d="M0,224L30,240C60,256,120,288,180,272C240,256,300,192,360,160C420,128,480,128,540,144C600,160,660,192,720,181.3C780,171,840,117,900,90.7C960,64,1020,64,1080,96C1140,128,1200,192,1260,197.3C1320,203,1380,149,1410,122.7L1440,96L1440,320L1410,320C1380,320,1320,320,1260,320C1200,320,1140,320,1080,320C1020,320,960,320,900,320C840,320,780,320,720,320C660,320,600,320,540,320C480,320,420,320,360,320C300,320,240,320,180,320C120,320,60,320,30,320L0,320Z"></path></svg>
                    <div class="wave3-fill"></div>
                </div>
            </div>

        </div>

        <nav class="nav-categories" id="nav-container">
        </nav>

        <main class="menu-container" id="menu-container">
        </main>

        <footer>
            <p><strong id="footer-title"></strong></p>
            <p id="footer-address"></p>
            <p id="footer-instagram" class="footer-instagram"></p>
        </footer>

        <div id="product-modal" class="modal">
            <div class="modal-content">
                <span class="close-modal" id="close-modal">&times;</span>
                <img id="modal-img" src="" alt="Producto real" onerror="this.style.display='none'">
                <h3 id="modal-title"></h3>
                <p id="modal-desc"></p>
                <!-- <button class="modal-btn" id="modal-close-btn">¡Lo quiero!</button> -->
            </div>
        </div>

        <script src="configs/data.js"></script>     
        <script src="js/header.js"></script>
        <script src="js/footer.js"></script>
        <script src="js/navegation.js"></script>
        <script src="js/modal.js"></script>
        <script src="js/productCards.js"></script>
        <script src="js/map.js"></script>

    </body>
</html>
